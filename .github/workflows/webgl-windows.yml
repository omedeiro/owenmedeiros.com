name: Live simulator on Windows Chrome

# Opens public/projects/tdgl/live/nbn-3d.html in Chrome on a Windows runner, once per ANGLE backend, and logs
# what a visitor would see (renderer, errors, GPU check, solver progress). The runner has no GPU, so Direct3D 11
# runs on Microsoft's software rasterizer (WARP): same shader translation as a real Windows GPU, not its driver.
# Each backend loads both this branch's copy and the deployed page on owenmedeiros.com.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - public/projects/tdgl/live/**
      - scripts/webgl-check/**
      - .github/workflows/webgl-windows.yml

jobs:
  chrome:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        angle: [default, d3d11, d3d11-warp, swiftshader]
        page: ["", "https://owenmedeiros.com/projects/tdgl/live/nbn-3d.html"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install playwright-core (uses the runner's installed Chrome)
        run: npm install --no-save --no-package-lock playwright-core@1.49.1
      - name: Load the simulator
        run: node scripts/webgl-check/check.mjs ${{ matrix.angle }} "${{ matrix.page }}"
      - name: Compile the failing shader with fxc, for its error messages
        if: failure()
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe | Where-Object FullName -like '*x64*' | Select-Object -Last 1
          Get-ChildItem shader-*.hlsl | ForEach-Object { Write-Host "== $($_.Name) =="; & $fxc.FullName /nologo /T ps_5_0 /E main /Fo NUL $_.FullName 2>&1 | Select-Object -First 40 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.angle }}${{ matrix.page && '-live' || '' }}
          path: |
            webgl-*.png
            shader-*.hlsl
            chrome-*.log
